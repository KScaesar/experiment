# 基本上只有 output timeout 的時候會用到
# 一般情況的錯誤都由 21_deadletter_app_error.conf 去處理
# 注意：本檔只有「通知分支」，無 @type file 存檔分支。
# 因為失敗資料在上游(10_pipeline_main.conf 的 <secondary>)已寫成 chunk 檔落地，這裡只是 tail 它來發通知，不需重複存檔。
<source>
  @type tail
  path /var/log/go/deadletter/bq_timeout.secondary/*
  pos_file /var/log/go/deadletter/bq_timeout.secondary.pos
  tag fluentd.bq_timeout
  read_from_head true
  refresh_interval 60s

  <parse>
    @type none
  </parse>
</source>

<filter fluentd.bq_timeout>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    # notify_group 非 Fluentd 原生欄位，只是自訂 key；意義來自下游消費它的 plugin
    # (此處給 @GCHAT_NOTIFY 的 throttle 當 group_key 做分組限流用)。
    notify_group fluentd_bq_timeout
    text ${"*[FLUENTD-BQ-TIMEOUT]*\n► Time: " + Time.at(time.to_i).utc.strftime("%Y-%m-%d %H:%M:%S") + "\n► Host: " + ENV["HOSTNAME"].to_s + "\n► Tag: " + tag.to_s + "\n► Row: ```" + record.to_json + "```\n"}
  </record>
</filter>

<match fluentd.bq_timeout>
  # relabel 不做輸出，只做「路由跳轉」：離開 tag 路由，改由 @label 指定的 label 區塊接手。
  # 三種通知來源(bq_timeout/app_error/parse_not_match)最後都跳到共用出口 @GCHAT_NOTIFY(30_notify_gchat.conf)。
  @type relabel
  @label @GCHAT_NOTIFY
</match>
