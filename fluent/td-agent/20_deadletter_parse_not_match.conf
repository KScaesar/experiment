<filter ad_fluentd.parse_not_match>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    raw_row ${record["raw_row"].to_s}
    error_date ${Time.at(time.to_i).strftime("%Y%m%d")}
  </record>
</filter>

<match ad_fluentd.parse_not_match>
  # event 被第一個 match 消費後即消失，故用 copy 複製成多份分岔。
  # <store> = copy 的其中一路去向(非「存檔」之意，做什麼看內層 @type)。
  @type copy
  <store>
    @type relabel                          # 一路 → 存檔
    @label @FLUENTD_PARSE_NOT_MATCH_FILE
  </store>
  <store>
    @type relabel                          # 一路 → 通知
    @label @GCHAT_NOTIFY_PARSE_NOT_MATCH
  </store>
</match>

<label @FLUENTD_PARSE_NOT_MATCH_FILE>
  # 這是「存檔分支」，任務就是把原始資料(raw_row)持久化落地，故 output 用 @type file。
  # parse_not_match / app_error 的 event 還在記憶體流動、尚未落地，只發通知會遺失原文，因此必須有這條 file 分支;
  # 對照 bq_timeout 上游已落地過，就沒有這條分支。(通知分支不寫檔，用的是 http。)
  <match **>
    @type file
    path /var/log/go/deadletter/parse_not_match.format-none/parse_not_match.${error_date}.log
    append true
    <format>
      @type single_value
      message_key raw_row
    </format>
    <buffer error_date>
      @type file
      path /var/log/go/deadletter/parse_not_match.format-none/.buffer
      flush_mode interval
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>

<label @GCHAT_NOTIFY_PARSE_NOT_MATCH>
  <filter **>
    @type record_transformer
    enable_ruby true
    renew_record true
    <record>
      notify_group fluentd_parse_not_match
      text ${"*[FLUENTD-PARSE-NOT-MATCH]*\n► Time: " + Time.at(time.to_i).utc.strftime("%Y-%m-%d %H:%M:%S") + "\n► Host: " + ENV["HOSTNAME"].to_s + "\n► Tag: " + tag.to_s + "\n► Row: " + record.to_json + "\n"}
    </record>
  </filter>

  <match **>
    @type relabel
    @label @GCHAT_NOTIFY
  </match>
</label>
