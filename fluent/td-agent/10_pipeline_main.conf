<source>
  @type tail
  path /var/log/go/ad.log
  pos_file /var/log/go/ad_fluentd.log.pos
  read_from_head true
  tag ad_fluentd
  rotate_wait 10s

  <parse>
    # multi_format：由上而下依序試每個 <pattern>，第一個解析成功者採用(故 format none 這種「必成功」的要放最後當 fallback)。
    # parse 階段能「新增 field」但有限：只限①解析內容拆出的欄位 ②format_key/keep_time_key/message_key 這幾個固定用途欄位;
    # 要加任意靜態值/計算值/引用他欄，需改用 source 的 <inject> 或 record_transformer/record_modifier filter，不能塞進 <parse>。
    @type multi_format
    # format_key：把「命中哪個 pattern 的 format_name」寫進此欄位(_parsed_format)，供下方 rewrite_tag_filter 依它分流。
    format_key _parsed_format

    <pattern>
      format json
      format_name json            # 此 pattern 的識別名，命中時 _parsed_format=json
      time_key datetime
      time_format %Y-%m-%d %H:%M:%S
      keep_time_key true          # 解析時間後仍保留原始 datetime 欄位(預設會被吃掉)
    </pattern>

    <pattern>
      format none                 # 不解析，保留原始字串當 fallback
      format_name parse_not_match      # 命中時 _parsed_format=parse_not_match
      message_key raw_row         # format none 專用：原始未解析字串放進 raw_row 欄位
    </pattern>
  </parse>
</source>

# parser 無法直接指定 tag(tag 一律沿用 source 的 ad_fluentd)。要「不同 parse 結果→不同 tag」須兩步:
#   ① parse 用 format_key 記下命中格式到 _parsed_format ② 此處 rewrite_tag_filter 讀該欄位改寫 tag。
# 要新增規則:<parse> 加 <pattern>(給不同 format_name、none 放最後) + 這裡加對應 <rule>。
# key 可換成任何欄位(如 _BC_)以依「內容值」分流;tag 種類多而難列舉時，改用下方 record_modifier 的 tag ${record[...]} 動態組 tag。
<match ad_fluentd>
  @type rewrite_tag_filter
  <rule>
    key _parsed_format
    pattern /^json$/
    tag ad_fluentd.json
  </rule>
  <rule>
    key _parsed_format
    pattern /^parse_not_match$/
    tag ad_fluentd.parse_not_match
  </rule>
</match>

# _BC_: Bounded Context

# 負責過濾出符合格式的事件
<filter ad_fluentd.json>
  @type filter
  all deny
  allow _BC_: "SVCX.ADLOG"
</filter>

# 負責過濾出符合格式但不上 bq 的欄位
<filter ad_fluentd.json>
  @type filter
  all allow
  deny _subject_: "ad.AD_RT"
</filter>

<filter ad_fluentd.json>
  @type record_modifier
  whitelist_keys datetime,_BC_,_bigquery_,payload
</filter>

<match ad_fluentd.json>
  @type record_modifier
  tag ${record["_BC_"]}.${record["_bigquery_"]}
  remove_keys _dummy_,payload
  <record>
    _dummy_ ${record["payload"].each { |k, v| record[k] = v }; nil}
  </record>
</match>


<match SVCX.ADLOG.*>
  @type bigquery_load
  @include 11_bq_output.conf
  @include 12_bq_buffer.conf

  <secondary>
    # 官方建議「打印優先，通知其次」，所以secondary 只負責印 log，不要再做其他處理
    # 由 22_deadletter_bq_timeout.conf 的 source 去 tail output 的 timeout
    @type secondary_file
    directory /var/log/go/deadletter/bq_timeout.secondary
    basename bq_timeout.${chunk_id}
  </secondary>
</match>
