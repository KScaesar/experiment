<buffer _bigquery_>
  @type file
  path /var/log/go/bigquery_ad_log.*.buffer
  chunk_limit_size 128MB
  total_limit_size 1GB
  # queued_chunks_limit_size：排隊中(enqueued)等待 flush 的 chunk「數量」上限(單位是個數，非 bytes)。
  # 它是舊版 queue_limit_length 的取代者，兩者單位相同；達到上限即觸發 overflow_action。
  # 總容量(bytes)由 total_limit_size 控制，非這個參數。flush_thread_count 大時勿設太小以免卡吞吐。
  queued_chunks_limit_size 4
  overflow_action throw_exception

  flush_at_shutdown true
  flush_mode interval
  flush_interval 60s
  flush_thread_count 1

  retry_timeout 24h
  retry_type exponential_backoff
  retry_wait 60s
  retry_max_interval 300
</buffer>