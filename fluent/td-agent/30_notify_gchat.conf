<label @GCHAT_NOTIFY>
  <filter **>
    # throttle 非 Fluentd 內建，是第三方 plugin(fluent-plugin-throttle)，需另裝 gem;
    # 內建 filter 只有 record_transformer / grep / parser / stdout，其餘 @type 多為第三方。
    # 下列 group_* 皆為此 plugin 定義的參數，作用：依 group_key 分組做防洪去重。
    @type throttle
    group_key notify_group
    group_bucket_period_s 120 # 同一類型的 error，每 120 秒內通知一次
    group_bucket_limit 1 # 最多只會收到一則通知
    group_drop_logs true
    group_reset_rate_s -1
  </filter>

  <filter **>
    @type record_transformer
    enable_ruby true
    <record>
      _gchat_notification true
      gchat_payload ${ {"text" => record["text"].to_s}.to_json }
    </record>
  </filter>

  <match **>
    @type http
    # @id：Fluentd 內建、選用的 plugin 唯一識別名(全域不可重複)。不影響資料流，
    # 純為維運：log/錯誤訊息、monitor_agent/Prometheus 指標、內部狀態都用它對應到此實例，方便排查。
    @id gchat_notify

    endpoint "#{ENV['SVCX_FLUENT_GCHAT_WEBHOOK_URL']}" # 務必先設定好環境變數，否則會無法通知
    http_method post
    content_type application/json
    open_timeout 5
    read_timeout 10

    <format>
      # single_value：不把整筆 record 轉 JSON，只輸出 message_key 指定欄位的「值」。
      # 這裡只送預先組好的 gchat_payload 當 HTTP body，其餘欄位丟棄;
      # add_newline false 避免結尾多換行破壞要送給 Google Chat 的 JSON。
      @type single_value
      message_key gchat_payload
      add_newline false
    </format>

    <buffer>
      @type file
      path /var/log/go/deadletter/notify_fail.secondary/buffer
      flush_mode immediate
      chunk_limit_records 1
      retry_max_times 3
      retry_wait 5s
    </buffer>

    # <secondary>：單一 output 的保底死信箱，僅在「chunk 用盡所有 retry(retry_max_times/retry_timeout)仍 flush 失敗」時觸發;
    # 平時成功路徑完全不經過它。與 copy→file 不同：copy 是「每筆都必達的分岔」，secondary 是「失敗才落地的 failover」。
    # 通知屬 best-effort，故這裡用 secondary 即可(連通知都發不出去時才留檔)，不需要 copy+file 每筆另存。
    <secondary>
      @type secondary_file
      directory /var/log/go/deadletter/notify_fail.secondary
      basename notify_fail.${chunk_id}
    </secondary>
  </match>
</label>
