<label @ERROR>
  <match **>
    # 一條 event 只會被「第一個」match 消費掉，之後就消失；要「一份走多路」必須用 copy 複製成多份。
    # 這裡把同一筆 app error 分岔成兩條「都必達」的路：存檔 + 通知，彼此獨立加工、獨立 buffer、互不影響。
    @type copy
    # <store>：copy 專用區塊，代表「其中一路的去向」；本身不等於存檔，做什麼由裡面的 @type 決定。
    <store>
      @type relabel                       # 這路：跳轉到 @FLUENTD_ERROR_FILE(下方用 @type file 落地)
      @label @FLUENTD_ERROR_FILE
    </store>
    <store>
      @type relabel                       # 那路：跳轉到通知流程
      @label @GCHAT_NOTIFY_FLUENTD_APP_ERROR
    </store>
  </match>
</label>

<label @FLUENTD_ERROR_FILE>
  <filter **>
    @type record_transformer
    enable_ruby true
    renew_record true
    <record>
      raw_row ${record.to_json}
      error_date ${Time.at(time.to_i).strftime("%Y%m%d")}
    </record>
  </filter>

  <match **>
    @type file
    path /var/log/go/deadletter/app_error.error-label/app_error.${error_date}.log
    append true
    <format>
      @type single_value
      message_key raw_row
    </format>
    <buffer error_date>
      @type file
      path /var/log/go/deadletter/app_error.error-label/.buffer
      flush_mode interval
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>

<label @GCHAT_NOTIFY_FLUENTD_APP_ERROR>
  <filter **>
  # 防止「GChat 通知事件又被當成錯誤事件重送」，避免通知迴圈
    @type grep
    <exclude>
      key _gchat_notification
      pattern ^true$
    </exclude>
  </filter>

  <filter **>
    @type record_transformer
    enable_ruby true
    renew_record true
    <record>
      notify_group fluentd_app_error

      # Fluentd root_agent 在處理 plugin error 時，不會把 plugin 的完整錯誤訊息
      # exception message / backtrace 帶進 error event record。
      # https://github.com/fluent/fluentd/blob/v1.13.3/lib/fluent/root_agent.rb#L339-L347
      
      # 因此這裡送到 Google Chat 的通知通常只能看到 tag 與原始 record，
      # 無法直接看到實際 plugin 失敗原因。
      #
      # 目前收到通知後，仍需要進 VM 查看 Fluentd log 才能確認完整錯誤 (/var/log/td-agent/td-agent.log)。
      # 另外 log_level 建議至少設為 warn，因為部分 plugin 的異常或重試訊息是以 warn 等級輸出，而不是 error。
      text ${"*[FLUENTD-APP-ERROR]*\n► Time: " + Time.at(time.to_i).utc.strftime("%Y-%m-%d %H:%M:%S") + "\n► Host: " + ENV["HOSTNAME"].to_s + "\n► Tag: " + tag.to_s + "\n► Row: " + record.to_json + "\n"}
    </record>
  </filter>

  <match **>
    @type relabel
    @label @GCHAT_NOTIFY
  </match>
</label>
